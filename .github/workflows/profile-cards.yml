name: Update GitHub Profile Cards

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
profile-cards:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v7

  - name: Generate profile cards
    uses: seijikohara/profile-cards-action@v0
    with:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      username: DebdiptoBiswas
      cards: lifetime
      output-dir: profile-cards
      themes: light,dark
      commit: true
```
